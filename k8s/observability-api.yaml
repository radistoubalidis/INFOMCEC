apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: observability-api }
  template:
    metadata:
      labels: { app: observability-api }
    spec:
      containers:
        - name: api
          image: infomcec-observability-api:latest
          imagePullPolicy: Never
          command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "3003"]
          ports: [{ containerPort: 3003 }]
          envFrom:
            - secretRef: { name: observability-db }
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /, port: 3003 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: observability-api
spec:
  type: LoadBalancer
  selector: { app: observability-api }
  ports:
    - port: 3003
      targetPort: 3003
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: observability-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: observability-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }
