x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  experiment-consumer:
    build: ./experiment-consumer
    container_name: experiment-consumer
    logging: *default-logging
    env_file:
      - .env
    volumes:
      - ./auth:/usr/src/auth
      - ./experiment-consumer/src:/usr/src/app
    restart: unless-stopped
    networks:
      - cec-assignment-group6
  
  experiment-producer:
    image: dclandau/cec-experiment-producer
    container_name: experiment-producer
    logging: *default-logging
    volumes:
      - ./auth:/experiment-producer/auth
      - ./experiment-producer/experiment-producer.env:/experiment-producer/.env
      - ./experiment-producer/config.json:/config.json
    networks:
      - cec-assignment-group6
    command: 
      - "-b"
      - "${BROKER}"
      - "--topic"
      - "${TOPIC}"
      - "--config-file"
      - "config.json"
    
  postgres:
    image: postgres:18
    command: postgres -c shared_preload_libraries=pg_stat_statements -c track_io_timing=on
    restart: unless-stopped
    container_name: experiment-db
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db/pgdata:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - cec-assignment-group6

  observability-api:
    profiles: ["dev"]
    build: ./observability-api
    container_name: observability-api
    logging: *default-logging
    ports:
      - "3003:3003"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}"
    depends_on:
      - postgres
    volumes:
      - ./observability-api/src:/app
    networks:
      - cec-assignment-group6

  adminer:
    image: adminer:5
    restart: unless-stopped
    container_name: pg-adminer
    logging: *default-logging
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - cec-assignment-group6

  notifications-api:
    image: dclandau/cec-notifications-service
    container_name: notifications-api
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - experiment-consumer
    networks:
      - cec-assignment-group6
    command: 
      - "--secret-key"
      - "${NOTIFICATIONS_SECRET_KEY}"
      - "--external-ip"
      - "localhost"
  
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru
    volumes: 
      - ./redisdata:/data
    networks: 
      - cec-assignment-group6

  notifier:
    build: ./notifier
    restart: unless-stopped
    container_name: notifier
    environment:
      REDIS_URL: redis://redis:6379/0
      NOTIFICATIONS_URL: ${NOTIFICATIONS_URL}
      DEBUG: ${DEBUG}
    volumes:
      - ./auth/token:/usr/src/auth/token:ro
    depends_on: 
      - redis
    networks: 
      - cec-assignment-group6

  db-cleanup:
    image: postgres:18
    container_name: db-cleanup
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["sh", "/cleanup.sh"]
    environment:
      PGHOST: postgres
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      MAX_ROWS: 10000000
      DELETE_FRACTION: 0.2
      CHECK_INTERVAL: 3600
    volumes:
      - ./db-cleanup/cleanup.sh:/cleanup.sh:ro
      - ./db:/data:ro
    depends_on:
      - postgres
    networks:
      - cec-assignment-group6

networks:
  cec-assignment-group6:
    driver: bridge
