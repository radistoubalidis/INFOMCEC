#  node-exporter measures the VM's CPU and memory -> Prometheus collects it -> course Grafana reads <vm-ip>:3008

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    pid: host                          
    volumes:                           
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    networks:
      - cec-assignment-group6

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro   # prometheus.yml
      - prometheus-data:/prometheus                  
    ports:
      - "3008:9090"                    
    networks:
      - cec-assignment-group6

volumes:
  prometheus-data:


