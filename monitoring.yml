# Monitoring stack: cAdvisor measures containers -> Prometheus stores + calculates cost -> Grafana shows it.
# Start:  docker compose -f docker-compose.yml -f monitoring.yml up -d cadvisor prometheus grafana

services:
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1   # ghcr.io tags have no "v" prefix
    container_name: cadvisor
    restart: unless-stopped
    privileged: true                         # needed to read the host's resource usage files
    cgroup: host                             # see every container's usage, not only its own
    volumes:                                 # read-only access to the host so it can find all containers
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    command:
      - --docker_only=true                   # report Docker containers only
    networks:
      - cec-assignment-group6

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro   # prometheus.yml + rules.yml
      - prometheus-data:/prometheus                  # keeps the history when the container restarts
    ports:
      - "9090:9090"                          # do NOT open this port in the AWS security group
    networks:
      - cec-assignment-group6

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}   # login: admin / this password
    volumes:                                 # data source + dashboard are loaded from files at startup
      - ./monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboard.json:/etc/grafana/dashboards/dashboard.json:ro
    ports:
      - "3001:3000"                          # 3000 is already used by notifications-api
    networks:
      - cec-assignment-group6

volumes:
  prometheus-data:
